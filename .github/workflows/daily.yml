name: 💌 Daily AI Love Letter
on:
  schedule:
    - cron: "0 6 * * *"   # 10:00 AM Gulf time every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  letter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate today's AI letter
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/generate_letter.py
      - name: Publish letter to the website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily.json
          git commit -m "💌 today's letter for Fats" || echo "no changes"
          git push
      - name: Email the letter to her
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WIFE_EMAIL: ${{ secrets.WIFE_EMAIL }}
        run: python scripts/send_email.py daily
